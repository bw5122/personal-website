    msapplication_TileColor: "#ffffff"

  schema:
    publisherType: Person
    sameAs:
      - https://www.linkedin.com/in/zhiwei-berry-wang-2b529a13a
      - https://oid.wharton.upenn.edu/profile/zwangcj/

