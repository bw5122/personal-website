params:
  env: production
  author: Zhiwei (Berry) Wang
  description: >-
    Zhiwei (Berry) Wang is a PhD candidate at the Wharton School studying
    technological adaptation, digital innovation, AI, and entrepreneurship.
  keywords:
    - technological adaptation
    - digital innovation
    - technology strategy
    - artificial intelligence
    - entrepreneurship
    - Wharton
  images:
    - /og.png
  defaultTheme: light
  disableThemeToggle: false
  hideFooter: true
  disableSpecial1stPost: true
  ShowBreadCrumbs: false
  ShowPostNavLinks: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowToc: false

  profileMode:
    enabled: true
    title: Zhiwei (Berry) Wang
    subtitle: >-
      I am a doctoral candidate in the Operations, Information and Decisions
      Department at the Wharton School of the University of Pennsylvania. My
      research examines how firms create and capture value from digital
      technologies, particularly AI. I pursue this question through two related
      streams: (1) how adopting firms integrate AI with their existing digital
      systems and capabilities, and (2) how enterprise technology providers
      commercialize digital innovation.
    imageUrl: /images/profile.jpg
    imageTitle: Portrait of Zhiwei (Berry) Wang
    imageWidth: 180
    imageHeight: 180

  socialIcons:
    - name: email
      title: Email Berry Wang
      url: mailto:zwangcj@upenn.edu
    - name: linkedin
      title: LinkedIn profile
      url: https://www.linkedin.com/in/zhiwei-berry-wang-2b529a13a
    - name: website
      title: Wharton profile
      url: https://oid.wharton.upenn.edu/profile/zwangcj/

  label:
    text: Zhiwei (Berry) Wang

  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
