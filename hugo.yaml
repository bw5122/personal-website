baseURL: "http://localhost:1313/"
locale: en-US
title: Zhiwei (Berry) Wang
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true
publishDir: dist

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: research
      name: Research
      url: /research/
      weight: 20
    - identifier: cv
      name: CV
      url: /cv/
      weight: 30
    - identifier: teaching
      name: Teaching
      url: /teaching/
      weight: 40
params:
  env: production
  author: Zhiwei (Berry) Wang
  description: >-
    Zhiwei (Berry) Wang is a PhD candidate at the Wharton School studying
    technological adaptation, digital innovation, AI, and entrepreneurship.
  keywords:
    - technological adaptation
    - digital innovation
    - technology strategy
    - artificial intelligence
    - entrepreneurship
    - Wharton
  images:
    - /og.png
  defaultTheme: light
  disableThemeToggle: false
  disableSpecial1stPost: true
  ShowBreadCrumbs: false
  ShowPostNavLinks: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowToc: false

  profileMode:
    enabled: true
    title: Zhiwei (Berry) Wang
    subtitle: >-
      PhD Candidate in Operations, Information and Decisions at the Wharton
      School · Technology Strategy · Digital Innovation · AI
    imageUrl: /images/profile.jpg
    imageTitle: Portrait of Zhiwei (Berry) Wang
    imageWidth: 180
    imageHeight: 180
    buttons:
      - name: Research
        url: /research/
      - name: CV (PDF)
        url: /cv.pdf

  socialIcons:
    - name: email
      title: Email Berry Wang
      url: mailto:zwangcj@upenn.edu
    - name: linkedin
      title: LinkedIn profile
      url: https://www.linkedin.com/in/zhiwei-berry-wang-2b529a13a
    - name: website
      title: Wharton profile
      url: https://oid.wharton.upenn.edu/profile/zwangcj/

  label:
    text: Zhiwei (Berry) Wang

  assets:
    disableHLJS: true
    theme_color: "#ffffff"
    msapplication_TileColor: "#ffffff"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
